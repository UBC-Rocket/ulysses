name: Ulysses firmware

on:
  pull_request:
  workflow_dispatch:

permissions: read-all

# Ensure only one instance of this workflow is running on a branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ulysses/cfp
    strategy:
      matrix:
        preset: [Debug, Release]
      fail-fast: false
    env:
      CMAKE_PRESET: ${{ matrix.preset }}
    steps:
      - name: Checkout firmware
        uses: actions/checkout@v7.0.1
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build
      - name: Install ARM GCC
        uses: carlosperate/arm-none-eabi-gcc-action@0edbb000a5a98e2292b051b463bff6f512547118 # v1.14.0
      - name: Configure firmware
        run: cmake --preset "$CMAKE_PRESET"
      - name: Build firmware
        run: cmake --build --preset "$CMAKE_PRESET"
  builds-succeeded:
    runs-on: ubuntu-slim
    needs: build
    if: ${{ always() }}
    steps:
      - name: Check if all builds succeeded
        env:
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          test "$BUILD_RESULT" = "success"
