name: Ulysses firmware

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Ensure only one instance of this workflow is running on a branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.preset }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ulysses/cfp
    strategy:
      matrix:
        preset: [Debug, Release]
      fail-fast: false
    env:
      CMAKE_PRESET: ${{ matrix.preset }}
    steps:
      - name: Checkout firmware
        uses: actions/checkout@v7.0.1
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build
      - name: Install ARM GCC
        uses: carlosperate/arm-none-eabi-gcc-action@0edbb000a5a98e2292b051b463bff6f512547118 # v1.14.0
        with:
          release: "15.3.Rel1"
      - name: Configure firmware
        run: cmake --preset "$CMAKE_PRESET"
      - name: Build firmware
        run: cmake --build --preset "$CMAKE_PRESET"
  builds-succeeded:
    name: All builds succeeded
    runs-on: ubuntu-latest
    needs: build
    if: ${{ always() }}
    steps:
      - name: Check if all builds succeeded
        env:
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          test "$BUILD_RESULT" = "success"
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Checkout firmware
        uses: actions/checkout@v7.0.1
        with:
          # super-linter needs the full git history to get the
          # list of files that changed across commits
          fetch-depth: 0
          persist-credentials: false
      - name: Run linter
        uses: super-linter/super-linter/slim@2da136927bd4a73596db63044b504547c62cb854 # v9.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          VALIDATE_CLANG_FORMAT: true

          # For PRs, the linter should only check the changed files. However, if it is a manual
          # trigger against the default branch, we can assume that the intention is to target the
          # entire codebase.
          VALIDATE_ALL_CODEBASE: ${{ github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch}}

          # Linter and formatter configuration files are at the root of the project
          LINTER_RULES_PATH: .

          # Report configuration errors for this action
          FAIL_ON_INVALID_GITHUB_ACTIONS_EVENT_CONFIGURATION: true
