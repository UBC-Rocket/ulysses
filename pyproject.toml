[project]
name = "ulysses"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "casadi>=3.8.2",
    "osqp>=1.1.3",
    "scipy>=1.18.1",
]

[dependency-groups]
dev = [
    "ruff>=0.17.6",
]

[tool.ruff]
target-version = "py312"
line-length = 100


[tool.ruff.lint]
extend-select = ["I", "UP", "B"]
